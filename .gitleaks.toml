title = "Drivechain Observatory secret scanning"

[extend]
useDefault = true

# These are deterministic blockchain transaction IDs, not Coinbase API tokens.
# Keep the exception limited to this field in the generated SQL fixtures,
# at their current archive paths and at the paths they had in history.
[[rules]]
id = "coinbase-access-token"

[[rules.allowlists]]
description = "Synthetic coinbase transaction IDs in generated fixtures"
condition = "AND"
paths = ['''(^|/)fixtures/(archive/)?(0005_source_fixture|0009_v6_fixture|0010_v7_fixture)\.sql$''']
regexTarget = "match"
regexes = ['''coinbase_txid"\s*:\s*"[0-9a-f]{64}"''']
